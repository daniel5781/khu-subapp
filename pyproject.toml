[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khu-subapp"
version = "0.1.0"
description = "산업연관표 편집, Leontief 분석 및 산업 네트워크 추출"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "networkx>=3.2,<4",
    "scipy>=1.11,<2",
    "openpyxl>=3.1.5,<4",
    "xlrd>=2,<3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
dashboard = ["streamlit>=1.52,<2", "matplotlib>=3.9,<4"]
bea = ["requests>=2.31,<3", "python-dotenv>=1,<2"]
dev = ["build>=1.2,<2", "ruff>=0.8,<1"]

[project.scripts]
khu-subapp = "dashboard.cli:main"

[tool.setuptools]
py-modules = ["functions", "preprocessing"]

[tool.setuptools.packages.find]
include = ["iolib*", "dashboard*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
include = ["iolib/**/*.py", "dashboard/**/*.py", "tests/**/*.py", "app.py", "functions.py", "preprocessing.py"]

[tool.ruff.lint]
select = ["E9", "F"]

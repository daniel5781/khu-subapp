name: Tests and package
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dashboard,dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python tests/regression_oracle.py --check
      - run: python -m build
